server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: email-campaign-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/${POSTGRES_DB:email_campaign_db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:email-campaign-ops}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-env}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  kafka:
    topic: ${KAFKA_TOPIC:campaign-events}

logging:
  level:
    root: INFO
    com.emailcampaign.api: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
